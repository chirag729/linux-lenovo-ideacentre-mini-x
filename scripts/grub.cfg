set timeout=10
set default=0

menuentry "1. ACPI boot - no DTB (display test)" {
    echo "Loading kernel (NO device tree - ACPI only)..."
    linux /Image nomodeset video=efifb:on console=tty0 earlycon earlyprintk loglevel=8 keep_bootcon

    echo "Loading initramfs..."
    initrd /initramfs.cpio.gz

    echo "Booting..."
}

menuentry "2. DTB boot + keep clocks (BEST)" {
    echo "Loading device tree..."
    devicetree /dtb/x1p42100-lenovo-ideacentre-x-gen10.dtb

    echo "Loading kernel..."
    linux /Image nomodeset video=efifb:on drm.modeset=0 clk_ignore_unused pd_ignore_unused console=tty0 earlycon earlyprintk loglevel=8 keep_bootcon

    echo "Loading initramfs..."
    initrd /initramfs.cpio.gz

    echo "Booting..."
}

menuentry "3. DTB boot (original)" {
    echo "Loading device tree..."
    devicetree /dtb/x1p42100-lenovo-ideacentre-x-gen10.dtb

    echo "Loading kernel..."
    linux /Image nomodeset console=tty0 earlycon earlyprintk loglevel=8

    echo "Loading initramfs..."
    initrd /initramfs.cpio.gz

    echo "Booting..."
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
