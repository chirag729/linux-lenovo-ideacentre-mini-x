set timeout=10
set default=0

menuentry "1. ACPI boot - no DTB (display test)" {
    echo "Loading kernel (NO device tree - ACPI only)..."
    linux /Image nomodeset video=efifb:on console=tty0 earlycon earlyprintk loglevel=8 keep_bootcon

    echo "Loading initramfs..."
    initrd /initramfs.cpio.gz

    echo "Booting..."
}

menuentry "2. DTB + DRM disabled (safe, telnet works)" {
    echo "Loading device tree..."
    devicetree /dtb/x1p42100-lenovo-ideacentre-x-gen10.dtb

    echo "Loading kernel..."
    linux /Image nomodeset video=efifb:on drm.modeset=0 clk_ignore_unused pd_ignore_unused console=tty0 earlycon earlyprintk loglevel=8 keep_bootcon

    echo "Loading initramfs..."
    initrd /initramfs.cpio.gz

    echo "Booting..."
}

menuentry "3. DTB + DRM enabled (display test)" {
    echo "Loading device tree..."
    devicetree /dtb/x1p42100-lenovo-ideacentre-x-gen10.dtb

    echo "Loading kernel..."
    linux /Image clk_ignore_unused pd_ignore_unused console=tty0 earlycon earlyprintk loglevel=8 keep_bootcon drm.debug=0x1ff log_buf_len=8M

    echo "Loading initramfs..."
    initrd /initramfs.cpio.gz

    echo "Booting..."
}

menuentry "4. DTB + DRM enabled + nomodeset fallback" {
    echo "Loading device tree..."
    devicetree /dtb/x1p42100-lenovo-ideacentre-x-gen10.dtb

    echo "Loading kernel..."
    linux /Image nomodeset clk_ignore_unused pd_ignore_unused console=tty0 earlycon earlyprintk loglevel=8 keep_bootcon

    echo "Loading initramfs..."
    initrd /initramfs.cpio.gz

    echo "Booting..."
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
